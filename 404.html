<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f1110">
  <title>Uy, no encontré eso · Mytux</title>
  <style>
    :root { color-scheme: dark light; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 2rem; text-align: center; background: radial-gradient(ellipse at 50% 30%, #12261c, #0f1110 65%); color: #f3f5f3; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.6; }
    main { max-width: 34rem; display: flex; flex-direction: column; gap: 1.1rem; align-items: center; }
    .big { font: 800 clamp(5rem, 22vw, 9rem)/1 Georgia, "Times New Roman", serif; background: linear-gradient(90deg, #8fcfa3, #86bcd9); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: #9aa49d; }
    a { display: inline-block; margin-top: .5rem; padding: .8rem 1.5rem; border-radius: 8px; background: #8fcfa3; color: #0f1110; font-weight: 700; text-decoration: none; }
    a:hover { background: #b4e0c3; }
    a:focus-visible { outline: 3px solid #86bcd9; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="big" aria-hidden="true">404</div>
    <h1>Uy, aquí no hay nada</h1>
    <p>Esa dirección no existe o se movió. Debió perderse en el monte, como a veces me pasa en los páramos. Vuelve al inicio y seguimos explorando.</p>
    <a href="/">Volver al inicio</a>
  </main>
</body>
</html>
